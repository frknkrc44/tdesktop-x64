name: Flatpak Packager

on:
  workflow_dispatch: null
  workflow_run:
    workflows:
      - Linux Build
    types:
      - completed

jobs:
  flatpak:
    name: Package NFGram
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Checkout Repository Assets
        uses: actions/checkout@v6

      - name: Download Latest Binary Artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          workflow: linux.yml
          workflow_conclusion: success
          name: Telegram-Desktop
          path: bin_archive

      - name: Create Flatpak Manifest
        run: |
          cat <<EOF > io.github.NFGram.yml
          app-id: io.github.NFGram
          runtime: org.gnome.Platform
          runtime-version: '51'
          sdk: org.gnome.Sdk
          command: Telegram
          finish-args:
            - --share=ipc
            - --share=network
            - --socket=wayland
            - --socket=fallback-x11
            - --socket=pulseaudio
            - --device=all
            - --system-talk-name=org.bluez
            - --talk-name=org.freedesktop.Notifications
            - --talk-name=org.gnome.Mutter.IdleMonitor
            - --talk-name=org.kde.StatusNotifierWatcher
            - --talk-name=com.canonical.AppMenu.Registrar
            - --talk-name=com.canonical.indicator.application
            - --talk-name=org.ayatana.indicator.application
            - --talk-name=org.sigxcpu.Feedback
            - --filesystem=home
            - --unset-env=QT_PLUGIN_PATH
          modules:
            - name: telegram-installer
              buildsystem: simple
              build-commands:
                - mkdir -p /app/bin /app/share/applications /app/share/icons/hicolor/512x512/apps/
                - cp Telegram_bin /app/bin/Telegram
                - chmod +x /app/bin/Telegram
                - cp app_icon.png /app/share/icons/hicolor/512x512/apps/io.github.NFGram.png
                - cp desktop_file.desktop /app/share/applications/io.github.NFGram.desktop
              sources:
                - type: file
                  path: bin_archive/Telegram
                  dest-filename: Telegram_bin
                - type: file
                  path: Telegram/Resources/art/icon512.png
                  dest-filename: app_icon.png
                - type: file
                  path: lib/xdg/io.github.NFGram.desktop
                  dest-filename: desktop_file.desktop
          EOF

      - name: Build Flatpak Bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean --repo=repo build_dir io.github.NFGram.yml
          flatpak build-bundle repo NFGram.flatpak io.github.NFGram

      - name: Upload Final Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: NFGram-Flatpak
          path: NFGram.flatpak
